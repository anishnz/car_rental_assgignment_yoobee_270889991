{% extends "base.html" %}
{% block title %}Edit Vehicle{% endblock %}
{% block content %}
<div class="card">
  <h1>Edit {{ vehicle.display_name() }} ({{ vehicle.registration_no }})</h1>

  <h2>Update Daily Rate</h2>
  <form method="post" action="{{ url_for('owner_vehicle_update_rate', vehicle_id=vehicle.vehicle_id) }}">
    <label>New daily rate (current: {{ vehicle.daily_rate | currency }})</label>
    <input type="number" step="0.01" name="new_rate" required>
    <p style="margin-top:16px;"><button class="btn" type="submit">Update Rate</button></p>
  </form>

  <h2>Update Status</h2>
  <form method="post" action="{{ url_for('owner_vehicle_update_status', vehicle_id=vehicle.vehicle_id) }}">
    <label>New status (current: {{ vehicle.status }})</label>
    <select name="status">
      {% for s in valid_statuses %}<option value="{{ s }}" {% if s == vehicle.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
    <p style="margin-top:16px;"><button class="btn" type="submit">Update Status</button></p>
  </form>

  <a class="btn secondary" href="{{ url_for('owner_vehicles') }}">Back to My Vehicles</a>
</div>
{% endblock %}
