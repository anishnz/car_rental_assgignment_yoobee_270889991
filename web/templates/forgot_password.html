{% extends "base.html" %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<div class="card">
  <h1>Password Reset</h1>
  <p class="muted">Simulated self-service reset (FR3) - ask your administrator for the reset keyword.</p>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Reset Keyword</label>
    <input type="text" name="reset_keyword" required>
    <label>New Password</label>
    <input type="password" name="new_password" required>
    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required>
    <p style="margin-top:16px;"><button class="btn" type="submit">Reset Password</button></p>
  </form>
</div>
{% endblock %}
