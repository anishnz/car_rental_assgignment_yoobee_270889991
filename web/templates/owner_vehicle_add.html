{% extends "base.html" %}
{% block title %}Add a New Vehicle{% endblock %}
{% block content %}
<div class="card">
  <h1>Add a New Vehicle</h1>
  <form method="post">
    <label>Registration Number</label>
    <input type="text" name="registration_no" required>
    <label>Brand</label>
    <input type="text" name="brand" required>
    <label>Model</label>
    <input type="text" name="model" required>
    <label>Year</label>
    <input type="number" name="year" required>
    <label>Vehicle Type</label>
    <select name="vehicle_type">
      {% for t in valid_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
    </select>
    <label>Number of Seats</label>
    <input type="number" name="seats" required>
    <label>Daily Rate</label>
    <input type="number" step="0.01" name="daily_rate" required>
    <p style="margin-top:16px;"><button class="btn" type="submit">Add Vehicle</button></p>
  </form>
  <a class="btn secondary" href="{{ url_for('owner_vehicles') }}">Back to My Vehicles</a>
</div>
{% endblock %}
